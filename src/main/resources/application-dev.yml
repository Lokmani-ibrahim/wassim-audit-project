server:
  port: ${SERVER_PORT:8082}

spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8081/realms/neos}

  jpa:
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true
    locations: classpath:db/migration

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/fintech_dev}
    username: ${DB_USERNAME:fintech_app}
    password: ${DB_PASSWORD:123456789}

neos:
  ledger:
    formance:
      base-url: ${FORMANCE_BASE_URL:http://localhost:8080}
      ledger-name: ${FORMANCE_LEDGER_NAME:neos}

  # Dev only: customer internal transfers and recipient lookup.
  # The base default (application.yaml) stays false; prod is unchanged.
  transfers:
    customer-api-enabled: ${NEOS_CUSTOMER_TRANSFER_API_ENABLED:true}