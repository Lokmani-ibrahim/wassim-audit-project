# NEOS login theme: Keycloak's "keycloak" (v1) login theme with a CSS-only NEOS skin.
# No template is overridden, so Keycloak upgrades keep working; only neos.css is added.
# Covers the login, registration, password-reset and error pages (they share template.ftl).
parent=keycloak
import=common/keycloak

# css/login.css resolves to the parent theme's file; css/neos.css is ours and loads last.
styles=css/login.css css/neos.css

meta=viewport==width=device-width,initial-scale=1
